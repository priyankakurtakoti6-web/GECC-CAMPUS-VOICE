<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GECC Campus Voice</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

    <div class="logo">
        <h1>GECC Campus Voice</h1>
        <p>One campus. One voice.</p>
    </div>

    <div class="header-actions">

        <span id="userStatus">Not logged in</span>

        <button id="loginBtn" class="login-btn">
            Student Login
        </button>

        <button id="logoutBtn" class="logout-btn hidden">
            Logout
        </button>

        <button id="newAnnouncementBtn" class="new-btn">
            + New Announcement
        </button>

    </div>

</header>


<!-- ================= MAIN ================= -->

<main>

    <section class="hero">

        <h2>What's happening on campus?</h2>

        <p>
            Stay updated with the latest announcements.
        </p>

    </section>


    <!-- SEARCH -->

    <div class="search-section">

        <div class="search-box">

            <span class="search-icon">⌕</span>

            <input
                type="text"
                id="searchInput"
                placeholder="Search announcements..."
            >

        </div>

    </div>


    <!-- FILTER + SORT -->

    <div class="controls">

        <div class="filters">

            <button
                class="category-btn active"
                data-category="all">
                All
            </button>

            <button
                class="category-btn"
                data-category="academic">
                Academic
            </button>

            <button
                class="category-btn"
                data-category="event">
                Events
            </button>

            <button
                class="category-btn"
                data-category="placement">
                Placement
            </button>

        </div>


        <select id="sortSelect">

            <option value="newest">
                Newest First
            </option>

            <option value="oldest">
                Oldest First
            </option>

            <option value="likes">
                Most Liked
            </option>

        </select>

    </div>


    <!-- NEW ANNOUNCEMENT FORM -->

    <section
        id="announcementForm"
        class="announcement-form hidden">

        <h3>Post New Announcement</h3>

        <input
            type="text"
            id="titleInput"
            placeholder="Announcement title"
        >

        <select id="categoryInput">

            <option value="academic">
                Academic
            </option>

            <option value="event">
                Event
            </option>

            <option value="placement">
                Placement
            </option>

        </select>

        <textarea
            id="descriptionInput"
            placeholder="Write announcement details..."
        ></textarea>

        <div class="form-buttons">

            <button
                id="addAnnouncementBtn"
                class="add-btn">
                Publish Announcement
            </button>

            <button
                id="cancelBtn"
                class="cancel-btn">
                Cancel
            </button>

        </div>

    </section>


    <!-- ANNOUNCEMENTS -->

    <section>

        <div
            id="announcementContainer"
            class="announcement-container">
        </div>

        <p
            id="noResults"
            class="no-results">
            No announcements found.
        </p>

    </section>

</main>


<!-- ================= LOGIN MODAL ================= -->

<div id="loginModal" class="modal hidden">

    <div class="modal-box">

        <button
            id="closeLoginBtn"
            class="close-modal">
            ×
        </button>

        <div class="login-icon">
            👤
        </div>

        <h2>Student Login</h2>

        <p class="modal-subtitle">
            Login to post and interact with announcements.
        </p>

        <label>
            Student Name
        </label>

        <input
            type="text"
            id="studentName"
            placeholder="Enter your name"
        >

        <label>
            Email Address
        </label>

        <input
            type="email"
            id="studentEmail"
            placeholder="Enter your email"
        >

        <button
            id="studentLoginSubmit"
            class="login-submit">
            Login
        </button>

    </div>

</div>


<script src="js/script.js"></script>

</body>
</html>
